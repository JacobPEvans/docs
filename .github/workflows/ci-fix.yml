name: CI Fix

on:
  # Manual dispatch only. workflow_run grants the base repository's write
  # permissions and secrets to a run whose head commit this repository does not
  # control, so the trigger is unsafe by construction rather than by
  # configuration — a job-level fork guard narrows the exposure but does not
  # remove it. Restoring automatic invocation needs the reusable workflow to
  # accept the failure context as an input; it currently reads
  # github.event.workflow_run directly and no-ops under any other trigger.
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-fix-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fix:
    uses: dryvist/ai-workflows/.github/workflows/cc-ci-fix.yml@main
    secrets:
      GH_ACTION_AI_API_KEY: ${{ secrets.GH_ACTION_AI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
    with:
      repo_context: >-
        Mintlify documentation site for docs.jacobpevans.com.
        MDX pages with YAML frontmatter, mermaid diagrams using the
        canonical hand-drawn Reef Green theme, navigation in docs.json.
      ci_structure: >-
        ci.yml validates docs.json with jq, installs mint via npm, and runs
        mint broken-links to check internal MDX links. osv-scan.yml is a
        reusable vuln-scan callout. CI fixes usually mean: docs.json JSON
        syntax error, a broken internal link from a renamed/moved page, or
        a mermaid block with a non-canonical theme directive.
