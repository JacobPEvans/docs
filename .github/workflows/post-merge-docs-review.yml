name: Post-Merge Docs Review

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to review"
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_NAME: ${{ github.workflow }}
      REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Re-trigger as workflow_dispatch
        run: |
          gh workflow run "$WORKFLOW_NAME" \
            --repo "$REPO" \
            --ref main \
            -f commit_sha="$COMMIT_SHA"

  review:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/cc-post-merge-docs-review.yml@main
    secrets:
      GH_ACTION_AI_API_KEY: ${{ secrets.GH_ACTION_AI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}
